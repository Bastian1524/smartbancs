services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bancs
      POSTGRES_PASSWORD: bancs123
      POSTGRES_DB: smartbancs
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  transaction_api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.transaction_service.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://bancs:bancs123@db:5432/smartbancs
  ai_api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.ai_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
